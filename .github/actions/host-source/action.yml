name: host source
description: >-
  Check out codefly-dev/module-saas-starter, read-only, at the ref SOURCE.txt
  records: the accounts proto path SOURCE.txt records, and its auth gateway
  path when asked. One reading of SOURCE.txt for every job that needs the host.
inputs:
  sdk:
    description: Where this repository is checked out.
    default: sdk
  path:
    description: Where to check the host out.
    default: source
  gateway:
    description: Also check out the auth gateway path SOURCE.txt records.
    default: "false"
outputs:
  ref:
    description: The git ref checked out (refs/tags/<tag> or a 40-hex commit).
    value: ${{ steps.source.outputs.ref }}
  proto:
    description: The accounts public proto path, relative to the host checkout.
    value: ${{ steps.source.outputs.proto }}
  gateway:
    description: The auth gateway Go module path, relative to the host checkout.
    value: ${{ steps.source.outputs.gateway }}
runs:
  using: composite
  steps:
    - name: read the recorded source ref
      id: source
      shell: bash
      env:
        SOURCE_TXT: ${{ inputs.sdk }}/SOURCE.txt
        WITH_GATEWAY: ${{ inputs.gateway }}
      run: |
        set -euo pipefail
        line=$(grep -m1 -oE 'codefly-dev/module-saas-starter@(v[0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{40})$' "$SOURCE_TXT" || true)
        if [ -z "$line" ]; then
          echo "::error file=SOURCE.txt::no 'codefly-dev/module-saas-starter@<release tag or 40-hex sha>' ref found"
          exit 1
        fi
        proto=$(grep -m1 -oE 'accounts public proto: [^)]+' "$SOURCE_TXT" | sed 's/^accounts public proto: //' || true)
        if [ -z "$proto" ]; then
          echo "::error file=SOURCE.txt::no '(accounts public proto: <path>)' line found"
          exit 1
        fi
        gateway=$(grep -m1 -oE 'auth gateway: [^)]+' "$SOURCE_TXT" | sed 's/^auth gateway: //' || true)
        if [ "$WITH_GATEWAY" = "true" ] && [ -z "$gateway" ]; then
          echo "::error file=SOURCE.txt::no '(auth gateway: <path>)' line found"
          exit 1
        fi
        ref=${line#*@}
        if [[ "$ref" == v* ]]; then
          ref="refs/tags/$ref"
        fi
        paths=$proto
        if [ "$WITH_GATEWAY" = "true" ]; then
          paths=$(printf '%s\n%s' "$proto" "$gateway")
        fi
        {
          echo "ref=$ref"
          echo "proto=$proto"
          echo "gateway=$gateway"
          echo "paths<<EOF"
          echo "$paths"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "source: codefly-dev/module-saas-starter@${line#*@} ($(echo $paths))"
    # The source repo is public, so the default token is enough.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: codefly-dev/module-saas-starter
        ref: ${{ steps.source.outputs.ref }}
        path: ${{ inputs.path }}
        sparse-checkout: ${{ steps.source.outputs.paths }}
        sparse-checkout-cone-mode: false
        persist-credentials: false
